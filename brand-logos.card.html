<!-- @dsCard group="Brand" viewport="700x230" name="Logo lockups" subtitle="The four approved lockups and their grounds" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Logo lockups</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:20px 24px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div class="pad" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
<div style="display:flex;flex-direction:column;gap:8px"><div style="background:var(--off-white);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:20px;display:flex;align-items:center;justify-content:center;height:88px"><img src="../assets/logos/enactus-primary.svg" style="max-width:100%;max-height:44px" alt="Enactus primary"></div><span style="font:var(--weight-medium) 10px/1.4 var(--font-core);color:var(--text-heading)">Primary<span style="display:block;font-weight:400;color:var(--text-muted)">Light &amp; Off-White grounds</span></span></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="background:var(--almost-black);border-radius:var(--radius-sm);padding:20px;display:flex;align-items:center;justify-content:center;height:88px"><img src="../assets/logos/enactus-full-color-white.png" style="max-width:100%;max-height:40px" alt="Enactus full colour white"></div><span style="font:var(--weight-medium) 10px/1.4 var(--font-core);color:var(--text-heading)">Full colour white<span style="display:block;font-weight:400;color:var(--text-muted)">Dark &amp; photo grounds</span></span></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="background:var(--enactus-gold);border-radius:var(--radius-sm);padding:20px;display:flex;align-items:center;justify-content:center;height:88px"><img src="../assets/logos/enactus-primary-black.svg" style="max-width:100%;max-height:44px" alt="Enactus all-black lockup"></div><span style="font:var(--weight-medium) 10px/1.4 var(--font-core);color:var(--text-heading)">All-black<span style="display:block;font-weight:400;color:var(--text-muted)">On gold &amp; light colour</span></span></div>
<div style="display:flex;flex-direction:column;gap:8px"><div style="background:var(--neutral-0);border:1px solid var(--border-subtle);border-radius:var(--radius-sm);padding:20px;display:flex;align-items:center;justify-content:center;height:88px"><img src="../assets/logos/enactus-mark-gold.png" style="max-width:100%;max-height:54px" alt="Enactus origami mark"></div><span style="font:var(--weight-medium) 10px/1.4 var(--font-core);color:var(--text-heading)">Origami mark<span style="display:block;font-weight:400;color:var(--text-muted)">Standalone, avatars</span></span></div>
</div></body></html>
