<!-- @dsCard group="Spacing" viewport="700x170" name="Motion" subtitle="Short fades and small translations — hover to test" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Motion</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:20px 24px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}.m{width:120px;height:60px;border-radius:var(--radius-md);background:var(--gold-200);border:1px solid var(--gold-400);display:flex;align-items:center;justify-content:center;font:var(--weight-medium) var(--text-xs)/1 var(--font-core);color:var(--almost-black)}.m1{transition:background-color var(--duration-fast) var(--ease-standard)}.m1:hover{background:var(--enactus-gold)}.m2{transition:transform var(--duration-base) var(--ease-standard),box-shadow var(--duration-base) var(--ease-standard)}.m2:hover{transform:translateY(-1px);box-shadow:var(--shadow-md)}.m3{transition:opacity var(--duration-base) var(--ease-out)}.m3:hover{opacity:.5}.m4{transition:transform var(--duration-instant) var(--ease-standard)}.m4:active{transform:scale(.985)}</style>
</head><body><div class="pad" style="display:flex;gap:18px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;gap:8px"><div class="m m1">hover</div><span style="font:var(--weight-regular) 10px/1.3 var(--font-core);color:var(--text-muted)">140ms colour<br>--duration-fast</span></div>
<div style="display:flex;flex-direction:column;gap:8px"><div class="m m2">hover</div><span style="font:var(--weight-regular) 10px/1.3 var(--font-core);color:var(--text-muted)">220ms lift −1px<br>--duration-base</span></div>
<div style="display:flex;flex-direction:column;gap:8px"><div class="m m3">hover</div><span style="font:var(--weight-regular) 10px/1.3 var(--font-core);color:var(--text-muted)">220ms fade<br>--ease-out</span></div>
<div style="display:flex;flex-direction:column;gap:8px"><div class="m m4">press</div><span style="font:var(--weight-regular) 10px/1.3 var(--font-core);color:var(--text-muted)">80ms scale .985<br>--press-scale</span></div>
</div></body></html>
