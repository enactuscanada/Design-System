<!-- @dsCard group="Colors" viewport="700x190" name="Brand colours" subtitle="The four official Enactus Canada colours" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Brand colours</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:20px 24px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div class="pad" style="display:grid;grid-template-columns:repeat(4,1fr);gap:20px">
<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:#FFC222;border:1px solid var(--border-subtle)"></div><div style="font:var(--weight-medium) var(--text-xs)/1.3 var(--font-core);color:var(--text-heading)">Enactus Gold</div><div style="font:var(--weight-regular) var(--text-3xs)/1.4 var(--font-core);color:var(--text-muted)">#FFC222<br>Pantone 7408C · 0/25/95/0</div></div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:#C88A12;border:1px solid var(--border-subtle)"></div><div style="font:var(--weight-medium) var(--text-xs)/1.3 var(--font-core);color:var(--text-heading)">Shadow Gold</div><div style="font:var(--weight-regular) var(--text-3xs)/1.4 var(--font-core);color:var(--text-muted)">#C88A12<br>Pantone 7555C · 0/37/100/23</div></div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:#070D0D;border:1px solid transparent"></div><div style="font:var(--weight-medium) var(--text-xs)/1.3 var(--font-core);color:var(--text-heading)">Almost Black</div><div style="font:var(--weight-regular) var(--text-3xs)/1.4 var(--font-core);color:var(--text-muted)">#070D0D<br>Pantone Black 6C · 76/67/66/84</div></div>
<div style="display:flex;flex-direction:column;gap:6px;min-width:0"><div style="height:64px;border-radius:var(--radius-sm);background:#F0EFEC;border:1px solid var(--border-subtle)"></div><div style="font:var(--weight-medium) var(--text-xs)/1.3 var(--font-core);color:var(--text-heading)">Off-White</div><div style="font:var(--weight-regular) var(--text-3xs)/1.4 var(--font-core);color:var(--text-muted)">#F0EFEC<br>Pantone 663C · 4/3/5/0</div></div>
</div></body></html>
