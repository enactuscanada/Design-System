<!-- @dsCard group="Spacing" viewport="700x150" name="Spacing scale" subtitle="4px base step, --space-0 through --space-32" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Spacing scale</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:20px 24px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div class="pad" style="display:flex;align-items:flex-end;gap:10px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:4px;height:4px;background:var(--enactus-gold);border-radius:var(--radius-xs)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted);text-align:center">1<br>4px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:8px;height:8px;background:var(--enactus-gold);border-radius:var(--radius-xs)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted);text-align:center">2<br>8px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:12px;height:12px;background:var(--enactus-gold);border-radius:var(--radius-xs)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted);text-align:center">3<br>12px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:16px;height:16px;background:var(--enactus-gold);border-radius:var(--radius-xs)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted);text-align:center">4<br>16px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:20px;height:20px;background:var(--enactus-gold);border-radius:var(--radius-xs)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted);text-align:center">5<br>20px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:24px;height:24px;background:var(--enactus-gold);border-radius:var(--radius-xs)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted);text-align:center">6<br>24px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:32px;height:32px;background:var(--enactus-gold);border-radius:var(--radius-xs)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted);text-align:center">8<br>32px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:40px;height:40px;background:var(--enactus-gold);border-radius:var(--radius-xs)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted);text-align:center">10<br>40px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:48px;height:48px;background:var(--enactus-gold);border-radius:var(--radius-xs)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted);text-align:center">12<br>48px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:64px;height:64px;background:var(--enactus-gold);border-radius:var(--radius-xs)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted);text-align:center">16<br>64px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:5px"><div style="width:80px;height:80px;background:var(--enactus-gold);border-radius:var(--radius-xs)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted);text-align:center">20<br>80px</span></div>
</div></body></html>
