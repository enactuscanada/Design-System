<!-- @dsCard group="Colors" viewport="700x150" name="Status colours" subtitle="Gold carries warning; red and green only where meaning demands it" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Status colours</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:20px 24px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div class="pad" style="display:grid;grid-template-columns:repeat(4,1fr);gap:16px">
<div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:36px;background:#2E9E5B"></div><div style="height:26px;background:#E6F4EC"></div><div style="padding:8px 10px;font:var(--weight-medium) var(--text-xs)/1.3 var(--font-core);color:var(--text-heading)">Success<div style="font:var(--weight-regular) 10px/1.4 var(--font-core);color:var(--text-muted)">#2E9E5B</div></div></div><div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:36px;background:#FFC222"></div><div style="height:26px;background:#FFF6DE"></div><div style="padding:8px 10px;font:var(--weight-medium) var(--text-xs)/1.3 var(--font-core);color:var(--text-heading)">Warning<div style="font:var(--weight-regular) 10px/1.4 var(--font-core);color:var(--text-muted)">#FFC222</div></div></div><div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:36px;background:#C0362C"></div><div style="height:26px;background:#FAE9E7"></div><div style="padding:8px 10px;font:var(--weight-medium) var(--text-xs)/1.3 var(--font-core);color:var(--text-heading)">Danger<div style="font:var(--weight-regular) 10px/1.4 var(--font-core);color:var(--text-muted)">#C0362C</div></div></div><div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="height:36px;background:#2B3033"></div><div style="height:26px;background:#F0EFEC"></div><div style="padding:8px 10px;font:var(--weight-medium) var(--text-xs)/1.3 var(--font-core);color:var(--text-heading)">Info<div style="font:var(--weight-regular) 10px/1.4 var(--font-core);color:var(--text-muted)">#2B3033</div></div></div>
</div></body></html>
