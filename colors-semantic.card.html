<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Semantic aliases</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:20px 24px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div class="pad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px 24px;font:var(--weight-regular) var(--text-xs)/1.5 var(--font-core)">
<div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="flex:0 0 auto;width:18px;height:18px;border-radius:3px;background:var(--off-white);border:1px solid var(--border-subtle)"></span><code style="color:var(--text-heading);font-size:11px">--surface-page</code></div><div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="flex:0 0 auto;width:18px;height:18px;border-radius:3px;background:var(--neutral-0);border:1px solid var(--border-subtle)"></span><code style="color:var(--text-heading);font-size:11px">--surface-card</code></div><div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="flex:0 0 auto;width:18px;height:18px;border-radius:3px;background:var(--enactus-gold);border:1px solid var(--border-subtle)"></span><code style="color:var(--text-heading);font-size:11px">--surface-brand</code></div><div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="flex:0 0 auto;width:18px;height:18px;border-radius:3px;background:var(--almost-black);border:1px solid var(--border-subtle)"></span><code style="color:var(--text-heading);font-size:11px">--text-heading</code></div><div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="flex:0 0 auto;width:18px;height:18px;border-radius:3px;background:var(--neutral-700);border:1px solid var(--border-subtle)"></span><code style="color:var(--text-heading);font-size:11px">--text-body</code></div><div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="flex:0 0 auto;width:18px;height:18px;border-radius:3px;background:var(--almost-black);border:1px solid var(--border-subtle)"></span><code style="color:var(--text-heading);font-size:11px">--text-on-brand</code></div><div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="flex:0 0 auto;width:18px;height:18px;border-radius:3px;background:var(--neutral-200);border:1px solid var(--border-subtle)"></span><code style="color:var(--text-heading);font-size:11px">--border-subtle</code></div><div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="flex:0 0 auto;width:18px;height:18px;border-radius:3px;background:var(--shadow-gold);border:1px solid var(--border-subtle)"></span><code style="color:var(--text-heading);font-size:11px">--text-link</code></div><div style="display:flex;align-items:center;gap:8px;min-width:0"><span style="flex:0 0 auto;width:18px;height:18px;border-radius:3px;background:var(--shadow-gold);border:1px solid var(--border-subtle)"></span><code style="color:var(--text-heading);font-size:11px">--focus-ring</code></div>
</div></body></html>
