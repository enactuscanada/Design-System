<!-- @dsCard group="Type" viewport="700x150" name="Presentation scale" subtitle="Brand Guide slide hierarchy in points" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Presentation scale</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:20px 24px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div class="pad" style="display:grid;grid-template-columns:repeat(5,1fr);gap:12px;font-family:var(--font-core)">
<div style="border-left:var(--border-width-rule) solid var(--enactus-gold);padding-left:12px"><div style="font:var(--weight-bold) var(--text-lg)/1.1 var(--font-core);color:var(--text-heading)">50pt</div><div style="font:var(--weight-medium) var(--text-xs)/1.4 var(--font-core);color:var(--text-heading);margin-top:2px">H1</div><div style="font:var(--weight-regular) 10px/1.4 var(--font-core);color:var(--text-muted)">Bold</div></div><div style="border-left:var(--border-width-rule) solid var(--enactus-gold);padding-left:12px"><div style="font:var(--weight-bold) var(--text-lg)/1.1 var(--font-core);color:var(--text-heading)">40pt</div><div style="font:var(--weight-medium) var(--text-xs)/1.4 var(--font-core);color:var(--text-heading);margin-top:2px">H2</div><div style="font:var(--weight-regular) 10px/1.4 var(--font-core);color:var(--text-muted)">Medium</div></div><div style="border-left:var(--border-width-rule) solid var(--enactus-gold);padding-left:12px"><div style="font:var(--weight-bold) var(--text-lg)/1.1 var(--font-core);color:var(--text-heading)">32pt</div><div style="font:var(--weight-medium) var(--text-xs)/1.4 var(--font-core);color:var(--text-heading);margin-top:2px">H3</div><div style="font:var(--weight-regular) 10px/1.4 var(--font-core);color:var(--text-muted)">Medium</div></div><div style="border-left:var(--border-width-rule) solid var(--enactus-gold);padding-left:12px"><div style="font:var(--weight-bold) var(--text-lg)/1.1 var(--font-core);color:var(--text-heading)">25pt</div><div style="font:var(--weight-medium) var(--text-xs)/1.4 var(--font-core);color:var(--text-heading);margin-top:2px">Body</div><div style="font:var(--weight-regular) 10px/1.4 var(--font-core);color:var(--text-muted)">Medium / Light</div></div><div style="border-left:var(--border-width-rule) solid var(--enactus-gold);padding-left:12px"><div style="font:var(--weight-bold) var(--text-lg)/1.1 var(--font-core);color:var(--text-heading)">20pt</div><div style="font:var(--weight-medium) var(--text-xs)/1.4 var(--font-core);color:var(--text-heading);margin-top:2px">Caption</div><div style="font:var(--weight-regular) 10px/1.4 var(--font-core);color:var(--text-muted)">Light / Thin</div></div>
</div></body></html>
