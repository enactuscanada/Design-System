<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Primary backgrounds</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:16px 24px;display:flex;flex-direction:column;gap:12px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>

muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">soft-bloom</span></div><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><img src="../assets/backgrounds/thumbs/primary-gold-light-diagonal-corners.jpg" alt="primary-gold-light-diagonal-corners" title="primary-gold-light-diagonal-corners" style="width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border:1px solid var(--border-subtle)"><span style="font:var(--weight-regular) var(--text-3xs)/1.3 var(--font-core);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">diagonal-corners</span></div><div style="display:flex;flex-direction:column;gap:4px;min-width:0"><img src="../assets/backgrounds/thumbs/primary-gold-light-amber-to-yellow.jpg" alt="primary-gold-light-amber-to-yellow" title="primary-gold-light-amber-to-yellow" style="width:100%;aspect-ratio:16/9;object-fit:cover;display:block;border:1px solid var(--border-subtle)"><span style="font:var(--weight-regular) var(--text-3xs)/1.3 var(--font-core);color:var(--text-muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">amber-to-yellow</span></div></div>
