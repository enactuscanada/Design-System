<!-- @dsCard group="Colors" viewport="700x200" name="Contrast pairings" subtitle="Approved text/background combinations and the two to avoid" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Contrast pairings</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:20px 24px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div class="pad" style="display:grid;grid-template-columns:repeat(3,1fr);gap:12px">
<div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="background:#F0EFEC;color:#070D0D;padding:14px 12px;font:var(--weight-medium) var(--text-sm)/1.3 var(--font-core)">Almost Black on Off-White</div><div style="padding:7px 12px;background:var(--neutral-0);font:var(--weight-medium) 10px/1.4 var(--font-core);color:var(--text-muted)">AAA — default body text</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="background:#FFC222;color:#070D0D;padding:14px 12px;font:var(--weight-medium) var(--text-sm)/1.3 var(--font-core)">Almost Black on Gold</div><div style="padding:7px 12px;background:var(--neutral-0);font:var(--weight-medium) 10px/1.4 var(--font-core);color:var(--text-muted)">AA+ — the only gold pairing</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="background:#070D0D;color:#F0EFEC;padding:14px 12px;font:var(--weight-medium) var(--text-sm)/1.3 var(--font-core)">Off-White on Almost Black</div><div style="padding:7px 12px;background:var(--neutral-0);font:var(--weight-medium) 10px/1.4 var(--font-core);color:var(--text-muted)">AAA — inverse sections</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="background:#F0EFEC;color:#C88A12;padding:14px 12px;font:var(--weight-medium) var(--text-sm)/1.3 var(--font-core)">Shadow Gold on Off-White</div><div style="padding:7px 12px;background:var(--neutral-0);font:var(--weight-bold) 10px/1.4 var(--font-core);color:var(--status-danger)">Large text only (18pt+)</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="background:#FFC222;color:#FFFFFF;padding:14px 12px;font:var(--weight-medium) var(--text-sm)/1.3 var(--font-core)">White on Gold</div><div style="padding:7px 12px;background:var(--neutral-0);font:var(--weight-bold) 10px/1.4 var(--font-core);color:var(--status-danger)">Never — fails contrast</div></div><div style="border-radius:var(--radius-sm);overflow:hidden;border:1px solid var(--border-subtle)"><div style="background:#C88A12;color:#F0EFEC;padding:14px 12px;font:var(--weight-medium) var(--text-sm)/1.3 var(--font-core)">Off-White on Shadow Gold</div><div style="padding:7px 12px;background:var(--neutral-0);font:var(--weight-bold) 10px/1.4 var(--font-core);color:var(--status-danger)">Never for body text</div></div>
</div></body></html>
