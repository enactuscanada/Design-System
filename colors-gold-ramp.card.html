<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Gold ramp</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:20px 24px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div class="pad"><div style="display:flex;border-radius:var(--radius-sm);overflow:hidden">
