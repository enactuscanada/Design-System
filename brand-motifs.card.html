<!-- @dsCard group="Brand" viewport="700x220" name="SDG devices" subtitle="SDG ring, curved line and colour bar — SDG contexts only" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>SDG devices</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div id="root"></div>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="tweaks-panel.jsx"></script>
<script type="text/babel">
const SDG_DEVICE_DEFAULTS = /*EDITMODE-BEGIN*/{
  "ground": "Off-White",
  "devices": "All",
  "notes": true
}/*EDITMODE-END*/;

const GROUNDS = {
  'Off-White': { background: 'var(--off-white)', ink: 'var(--text-heading)', muted: 'var(--text-muted)' },
  'Almost Black': { background: 'var(--almost-black)', ink: 'var(--off-white)', muted: 'var(--neutral-300)' },
  'Gold': { background: 'var(--bg-primary-gold-light-side-glow) center/cover', ink: 'var(--almost-black)', muted: 'var(--gold-900)' }
};

function SdgDevices() {
  const [t, setTweak] = useTweaks(SDG_DEVICE_DEFAULTS);
  const g = GROUNDS[t.ground] || GROUNDS['Off-White'];
  const cap = { font: 'var(--weight-regular) var(--text-3xs)/1.3 var(--font-core)', color: g.muted };
  const showRing = t.devices === 'All' || t.devices === 'Ring';
  const showLine = t.devices === 'All' || t.devices === 'Line & bar';
  return (
    <div style={{ minHeight: '100vh', boxSizing: 'border-box', padding: '20px 24px', background: g.background, display: 'flex', flexDirection: 'column', gap: 14 }}>
      <div style={{ display: 'flex', gap: 28, alignItems: 'center' }}>
        {showRing && (
          <div style={{ display: 'flex', flexDirection: 'column', alignItems: 'center', gap: 8 }}>
            <img src="../assets/illustrations/sdg-ring.png" alt="SDG ring" style={{ height: 104 }} />
            <span style={cap}>SDG ring</span>
          </div>
        )}
        {showLine && (
          <div style={{ flex: 1, display: 'flex', flexDirection: 'column', gap: 10, minWidth: 0 }}>
            <img src="../assets/illustrations/sdg-curved-line.png" alt="SDG curved line" style={{ width: '100%', maxHeight: 72, objectFit: 'contain' }} />
            <img src="../assets/illustrations/sdg-color-bar.png" alt="SDG colour bar" style={{ width: '100%', height: 14, objectFit: 'cover' }} />
            <span style={cap}>SDG curved line &amp; colour bar</span>
          </div>
        )}
      </div>
      {t.notes && (
        <p style={{ margin: 0, font: 'var(--weight-regular) var(--text-2xs)/1.5 var(--font-core)', color: g.ink }}>
          Use only where the content is about the Sustainable Development Goals. Never recolour, crop the ring, or reorder the 17 goal colours.
        </p>
      )}
      <TweaksPanel>
        <TweakSection label="Preview" />
        <TweakRadio label="Ground" value={t.ground} options={['Off-White', 'Almost Black', 'Gold']} onChange={(v) => setTweak('ground', v)} />
        <TweakRadio label="Devices" value={t.devices} options={['All', 'Ring', 'Line & bar']} onChange={(v) => setTweak('devices', v)} />
        <TweakToggle label="Usage note" value={t.notes} onChange={(v) => setTweak('notes', v)} />
      </TweaksPanel>
    </div>
  );
}
ReactDOM.createRoot(document.getElementById('root')).render(<SdgDevices />);
</script>
</body></html>
