<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Spacing in use</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:20px 24px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div class="pad"><div style="background:var(--neutral-0);border:1px solid var(--border-subtle);border-top:var(--border-width-rule) solid var(--enactus-gold);border-radius:var(--radius-card);padding:24px;position:relative">

</div></div></body></html>
