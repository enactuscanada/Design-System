<!-- @dsCard group="Slides" viewport="1280x720" name="08 SDG spotlight" subtitle="Goal statement on an SDG colour panel" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>SDG spotlight</title>
<style>html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#161C1C}iframe{border:0;width:1280px;height:720px;display:block}a{color:#C88A12}a:hover{color:#96660D}</style>
</head><body>
<iframe id="f" src="../templates/enactus-deck/EnactusDeck.dc.html" scrolling="no" title="SDG spotlight"></iframe>
<script>
const f=document.getElementById('f'),n=8;
function go(t){try{const s=f.contentDocument.querySelector('[data-screen-label^="'+String(n).padStart(2,'0')+' "]');if(s){f.contentWindow.scrollTo(0,s.getBoundingClientRect().top+f.contentWindow.scrollY);return}}catch(e){}if(t<60)setTimeout(()=>go(t+1),100)}
f.addEventListener('load',()=>go(0));
</script>
</body></html>
