<!-- @dsCard group="Spacing" viewport="700x140" name="Corner radii" subtitle="Small radii honour the folded-paper geometry; pills are for tags only" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Corner radii</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:20px 24px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div class="pad" style="display:flex;gap:16px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:70px;height:48px;background:var(--gold-200);border:1px solid var(--gold-400);border-radius:0px"></div><span style="font:var(--weight-regular) 10px/1.3 var(--font-core);color:var(--text-muted);text-align:center">none<br>0px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:70px;height:48px;background:var(--gold-200);border:1px solid var(--gold-400);border-radius:2px"></div><span style="font:var(--weight-regular) 10px/1.3 var(--font-core);color:var(--text-muted);text-align:center">xs<br>2px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:70px;height:48px;background:var(--gold-200);border:1px solid var(--gold-400);border-radius:4px"></div><span style="font:var(--weight-regular) 10px/1.3 var(--font-core);color:var(--text-muted);text-align:center">sm<br>4px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:70px;height:48px;background:var(--gold-200);border:1px solid var(--gold-400);border-radius:6px"></div><span style="font:var(--weight-regular) 10px/1.3 var(--font-core);color:var(--text-muted);text-align:center">md<br>6px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:70px;height:48px;background:var(--gold-200);border:1px solid var(--gold-400);border-radius:10px"></div><span style="font:var(--weight-regular) 10px/1.3 var(--font-core);color:var(--text-muted);text-align:center">lg<br>10px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:70px;height:48px;background:var(--gold-200);border:1px solid var(--gold-400);border-radius:16px"></div><span style="font:var(--weight-regular) 10px/1.3 var(--font-core);color:var(--text-muted);text-align:center">xl<br>16px</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:6px"><div style="width:70px;height:48px;background:var(--gold-200);border:1px solid var(--gold-400);border-radius:999px"></div><span style="font:var(--weight-regular) 10px/1.3 var(--font-core);color:var(--text-muted);text-align:center">pill<br>999px</span></div>
</div></body></html>
