<!-- @dsCard group="Brand" viewport="700x200" name="Icon anatomy" subtitle="Painted gold circle + single-weight ink line art" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Icon anatomy</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:20px 24px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div class="pad" style="display:flex;gap:24px;align-items:center">
<img src="../assets/icons/_circle.png" alt="Painted gold circle" style="width:96px;height:96px">
<span style="font:var(--weight-light) 34px/1 var(--font-core);color:var(--neutral-300)">+</span>
<img src="../assets/icons/handshake.png" alt="Handshake icon" style="width:96px;height:96px">
<div style="flex:1;display:flex;flex-direction:column;gap:8px;font:var(--weight-regular) var(--text-xs)/1.55 var(--font-core);color:var(--text-body)">
<div>The circle is a <strong style="color:var(--text-heading)">painted, slightly irregular</strong> gold disc — not a vector circle. Keep its texture.</div>
<div>Line art is single-weight, rounded-cap, in icon ink <code style="color:var(--text-heading)">#232F3A</code>, and deliberately overflows the disc.</div>
<div>Do not substitute flat, filled or multi-colour icon sets, and do not hand-draw replacements.</div>
</div></div></body></html>
