<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Enactus Canada Design System</title>
<link rel="stylesheet" href="styles.css">
<style>html,body{margin:0;width:1280px;height:854px;overflow:hidden}.tile{width:1280px;height:854px;display:grid;grid-template-columns:1fr 300px}.main{background:var(--enactus-gold);display:flex;align-items:center;justify-content:center;padding:0 64px}.main img{width:100%;max-width:620px;height:auto;display:block}.strip{display:grid;grid-template-rows:repeat(3,1fr)}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div class="tile">
<div class="main"><img src="assets/logos/enactus-primary-black.svg" alt="Enactus"></div>
<div class="strip"><div style="background:#C88A12"></div><div style="background:#96660D"></div><div style="background:#070D0D"></div></div>
</div></body></html>
