<!-- @dsCard group="Spacing" viewport="700x150" name="Elevation" subtitle="Neutral-tinted shadows only — never gold, never glow" -->
<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><title>Elevation</title>
<link rel="stylesheet" href="../styles.css">
<style>html,body{margin:0}body{background:var(--surface-page);font-family:var(--font-core);color:var(--text-body)}.pad{padding:20px 24px}a{color:var(--text-link)}a:hover{color:var(--text-link-hover)}</style>
</head><body><div class="pad" style="display:flex;gap:18px;flex-wrap:wrap">
<div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:104px;height:56px;background:var(--neutral-0);border-radius:var(--radius-md);box-shadow:0 1px 2px rgba(7,13,13,.06)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted)">--shadow-xs</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:104px;height:56px;background:var(--neutral-0);border-radius:var(--radius-md);box-shadow:0 1px 3px rgba(7,13,13,.08),0 1px 2px rgba(7,13,13,.04)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted)">--shadow-sm</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:104px;height:56px;background:var(--neutral-0);border-radius:var(--radius-md);box-shadow:0 4px 12px rgba(7,13,13,.10)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted)">--shadow-md</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:104px;height:56px;background:var(--neutral-0);border-radius:var(--radius-md);box-shadow:0 12px 32px rgba(7,13,13,.14)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted)">--shadow-lg</span></div><div style="display:flex;flex-direction:column;align-items:center;gap:8px"><div style="width:104px;height:56px;background:var(--neutral-0);border-radius:var(--radius-md);box-shadow:0 0 0 3px rgba(200,138,18,.35)"></div><span style="font:var(--weight-regular) 10px/1.2 var(--font-core);color:var(--text-muted)">--shadow-focus</span></div>
</div></body></html>
